name: 采集并部署

on:
  push:
    branches: [main]
    paths:
      - 'config.json'
      - 'scripts/**'
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install deps
      run: pip install requests
    
    - name: Collect data
      run: python scripts/collect.py
      
    - name: Generate pages
      run: python scripts/generate.py
    
    - name: Commit data
      run: |
        git config user.name "bot"
        git config user.email "bot@x"
        git add events/
        git diff --quiet && git diff --staged --quiet || git commit -m "auto: update $(date +%Y-%m-%d)"
        git push
    
    - name: Deploy to Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: .
        keep_files: true
