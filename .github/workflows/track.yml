name: 生成并部署

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Install deps
      run: pip3 install requests --break-system-packages || pip install requests
    
    - name: Generate pages
      run: python scripts/generate.py
    
    - name: Commit data
      run: |
        git config user.name "bot"
        git config user.email "bot@x"
        git add events/
        git diff --quiet && git diff --staged --quiet || git commit -m "auto: update $(date +%Y-%m-%d)"
        git push
    
    - name: Deploy to Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: .
        keep_files: true
